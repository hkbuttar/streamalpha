services:
  - type: web
    name: streamalpha-backend
    runtime: python
    plan: free
    rootDir: .
    # requirements-base.txt, not requirements.txt: the latter's -e
    # ../alpha-signal-lab line only resolves when both repos are checked
    # out as siblings, which Render's build environment never is (it
    # clones only this repo). backend/main.py doesn't import anything
    # from alpha-signal-lab anyway -- see README.md's Deployment section.
    buildCommand: pip install -r requirements-base.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: streamalpha-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false # managed Kafka provider's bootstrap servers -- see README.md's Deployment section
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false # e.g. SASL_SSL; leave unset only if your provider genuinely needs no auth
      - key: KAFKA_SASL_MECHANISM
        sync: false # e.g. PLAIN or SCRAM-SHA-256, per your provider
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # set to your Vercel deployment URL(s), comma-separated, after the frontend is deployed
      - key: PYTHON_VERSION
        value: 3.11.9

  # Background workers, not web services -- these are long-running Kafka
  # consumer/producer loops (streaming/consumer.py's poll loop,
  # ingestion/run.py's WebSocket connection), not request/response HTTP
  # servers, so they don't bind $PORT the way streamalpha-backend does.
  # `type: worker` is what Render calls this. Confirmed live: Render's
  # free (Hobby) plan does not support `type: worker` at all -- a
  # Blueprint sync attempted on `plan: free` failed outright with
  # "service type is not available for this plan" for all three, not a
  # resource/quota limit. `plan: starter` (paid, confirm current price on
  # Render's own service-creation screen before committing to it) is
  # required, not just a fallback.
  - type: worker
    name: streamalpha-ingestion
    runtime: python
    plan: starter
    rootDir: .
    # The one Render service that actually needs alpha-signal-lab
    # (ingestion/alpaca_stream.py imports config.universe.UNIVERSE) --
    # requirements-base.txt has everything else; alpha-signal-lab is
    # installed separately from its public GitHub repo, since Render
    # only clones streamalpha and the local editable path
    # (-e ../alpha-signal-lab, requirements.txt) never resolves here.
    # This needs alpha-signal-lab/pyproject.toml pushed to GitHub with
    # real packaging metadata ([build-system]/[project]) for pip to be
    # able to build it from a git URL at all.
    buildCommand: >
      pip install -r requirements-base.txt &&
      pip install "alpha-signal-lab @ git+https://github.com/hkbuttar/alpha-signal-lab.git"
    startCommand: python -m ingestion
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ALPACA_MAX_SYMBOLS
        sync: false # find this empirically against your account -- see .env.example
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: worker
    name: streamalpha-streaming
    runtime: python
    plan: starter
    rootDir: .
    # requirements-base.txt -- streaming/ doesn't import from
    # alpha-signal-lab at all; see the note on streamalpha-backend above.
    buildCommand: pip install -r requirements-base.txt
    startCommand: python -m streaming
    # Persists model_state.pkl across deploys/restarts -- without this, a
    # Render worker's local disk is wiped on every deploy and every
    # ticker's model starts cold. See README.md's Deployment section.
    disk:
      name: streamalpha-streaming-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_CONSUMER_GROUP
        sync: false
      - key: ANOMALY_WINDOW_SECONDS
        sync: false
      - key: MODEL_STATE_PATH
        value: /var/data/model_state.pkl
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: worker
    name: streamalpha-storage
    runtime: python
    plan: starter
    rootDir: .
    # requirements-base.txt -- storage/ doesn't import from
    # alpha-signal-lab at all; see the note on streamalpha-backend above.
    buildCommand: pip install -r requirements-base.txt
    startCommand: python -m storage
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: streamalpha-db
          property: connectionString
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: STORAGE_CONSUMER_GROUP
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: streamalpha-db
    plan: free
