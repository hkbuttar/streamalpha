services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: streamalpha-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: creates the topics this project needs against the single local
  # broker above, then exits. Re-running docker-compose up is idempotent
  # (--if-not-exists). Partition counts are for local dev only -- revisit
  # when moving to a managed Kafka provider for deployment.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic market-ticks --partitions 6 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic market-ticks-dlq --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic volume-anomalies --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic regime-changes --partitions 3 --replication-factor 1 &&
      echo 'Topics created:' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
      "

  # Local dev/test only -- same reasoning as kafka above: production points
  # DATABASE_URL at a managed Postgres instead (see .env.example). Host
  # port is 5433, not the default 5432: this machine already has an
  # unrelated alpha-signal-lab-pg container bound to 5432.
  postgres:
    image: postgres:16-alpine
    container_name: streamalpha-postgres
    environment:
      POSTGRES_USER: streamalpha
      POSTGRES_PASSWORD: streamalpha
      POSTGRES_DB: streamalpha
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamalpha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kafka-data:
  postgres-data:
